name: Android build

on:
  push:
    branches: [ main, "codex/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Unit tests
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest --stacktrace --console=plain 2>&1 | tee gradle-test.log
      - name: Debug APK
        run: |
          set -euo pipefail
          ./gradlew assembleDebug lintDebug --stacktrace --console=plain 2>&1 | tee gradle-build.log
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yzua-build-reports
          path: |
            gradle-*.log
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yzua-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error


