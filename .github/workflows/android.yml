name: Android build

on:
  push:
    branches: [ main, "codex/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Protect backend during UI redesign
        if: startsWith(github.ref, 'refs/heads/codex/ui-') || startsWith(github.head_ref, 'codex/ui-')
        run: node scripts/check-ui-scope.cjs origin/codex/urp-timetable
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: SSO script behavior tests
        run: node --test scripts/test-*.cjs
      - name: Unit tests
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest --stacktrace --console=plain 2>&1 | tee gradle-test.log
      - name: Debug APK
        run: |
          set -euo pipefail
          ./gradlew assembleDebug lintDebug --stacktrace --console=plain 2>&1 | tee gradle-build.log
      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yzua-build-reports
          path: |
            gradle-*.log
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yzua-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error



  release:
    # 推送 v* 标签时构建正式签名 APK 并发布到 GitHub Releases；密钥只来自仓库 Secrets。
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.YZUA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "Missing YZUA_KEYSTORE_BASE64 secret"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/yzua-release.jks"
      - name: Signed release APK
        env:
          YZUA_KEYSTORE_FILE: ${{ runner.temp }}/yzua-release.jks
          YZUA_KEYSTORE_PASSWORD: ${{ secrets.YZUA_KEYSTORE_PASSWORD }}
          YZUA_KEY_ALIAS: ${{ secrets.YZUA_KEY_ALIAS }}
          YZUA_KEY_PASSWORD: ${{ secrets.YZUA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease lintRelease --stacktrace --console=plain
          APK="YZUA-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          "$ANDROID_HOME"/build-tools/35.0.0/apksigner verify --print-certs "$APK" | grep -q "CN=XiaoLaoHus" || { echo "APK is not signed with the release key"; exit 1; }
          sha256sum "$APK" | tee "$APK.sha256"
          rm -f "$RUNNER_TEMP/yzua-release.jks"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="YZUA-${GITHUB_REF_NAME}.apk"
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" "$APK.sha256" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" "$APK.sha256" --title "YZUA ${GITHUB_REF_NAME}" --latest               $( [ -f "$NOTES" ] && echo --notes-file "$NOTES" || echo --generate-notes )
          fi
